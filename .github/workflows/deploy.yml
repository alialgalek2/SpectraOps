name: Deploy SpectraOps

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v3

      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.algaletech.com
          username: algalete@spectraops.algaletech.com
          password: Alialgale2@ # Recommended to at least keep password secret
          server-dir: /home/algalete/spectraops.algaletech.com/
          timeout: 600000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            README.md
