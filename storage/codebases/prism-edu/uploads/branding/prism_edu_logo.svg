<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 260" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="canvasClean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091830" />
      <stop offset="60%" stop-color="#133f83" />
      <stop offset="100%" stop-color="#0b172a" />
    </linearGradient>

    <!-- Refraction Glow for Focal Points -->
    <filter id="cleanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- EDU Capsule Badge Gradient -->
    <linearGradient id="badgeGradClean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0dc0e7" />
      <stop offset="100%" stop-color="#2c88c1" />
    </linearGradient>
  </defs>

  <!-- Background Surface -->
  <rect width="100%" height="100%" rx="20" fill="url(#canvasClean)" />

  <!-- ==================== CLEAN GEOMETRIC PRISM ICON (ISOLATED PLANES) ==================== -->
  <g transform="translate(62, 38)">
    <!-- Base Bottom Anchor (Deep Slate Navy #36527b) -->
    <polygon points="38,154 158,154 138,126 58,126" 
             fill="#36527b" />

    <!-- Right Rising Strut (Electric Vibrant Cyan #0dc0e7) -->
    <polygon points="158,154 98,34 78,62 126,132" 
             fill="#0dc0e7" 
             filter="url(#cleanGlow)" />

    <!-- Left Descending Strut (Pure Mid Blue #2c88c1) -->
    <polygon points="98,34 38,154 68,126 98,70" 
             fill="#2c88c1" />

    <!-- Isolated Inner Prismatic Core (Clean Ice Cyan #bef6fd) -->
    <polygon points="98,78 78,118 118,118" 
             fill="#bef6fd" 
             opacity="0.9" />

    <!-- Apex Crystal Beacon -->
    <circle cx="98" cy="34" r="3.5" fill="#eefdff" filter="url(#cleanGlow)" />
  </g>

  <!-- ==================== TYPOGRAPHY & BRANDING ==================== -->
  <g transform="translate(275, 126)">
    <!-- Main Brand Name: PRISM -->
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Roboto, sans-serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="6" 
          fill="#eefdff">PRISM</text>

    <!-- Minimalist EDU Capsule Badge -->
    <g transform="translate(258, -46)">
      <rect width="90" height="46" rx="23" fill="url(#badgeGradClean)" />
      <text x="45" y="30" 
            font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Roboto, sans-serif" 
            font-size="20" 
            font-weight="800" 
            letter-spacing="2" 
            fill="#eefdff" 
            text-anchor="middle">EDU</text>
    </g>

    <!-- Tagline -->
    <text x="3" y="44" 
          font-family="system-ui, -apple-system, 'Inter', Roboto, sans-serif" 
          font-size="16.5" 
          font-weight="400" 
          letter-spacing="1.2" 
          fill="#92c6de">The intelligent spectrum for modern education</text>
  </g>
</svg>
